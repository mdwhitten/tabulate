server {
    listen 80;
    server_name _;

    # Increase upload limit for receipt images
    client_max_body_size 20M;

    # Serve the built React SPA
    root /usr/share/nginx/html;
    index index.html;

    # All unknown paths → SPA index (React Router / hash navigation)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* calls to the FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Streaming upload: the backend sends NDJSON progress events while it reads
    # the receipt, so the response must reach the browser unbuffered.
    location = /api/receipts/upload-stream {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Cache hashed JS/CSS assets aggressively (Vite fingerprints them)
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
